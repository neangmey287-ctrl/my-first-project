<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Git</title>
</head>
<body>
    <h1>សួស្តី Git និង GitHub!</h1>
    <h2>មូលហេតុដែលមើលទៅដូចជាត្រូវធ្វើច្រើនដងមិញនេះ គឺដោយសារតែលើកទី១ យើងវាយពាក្យបញ្ជាខ្វះ (វាយត្រឹម git commit -m តែគ្មានដាក់សារពណ៌នា) ធ្វើឱ្យប្រព័ន្ធវាចេញ Error ហើយការ Commit នោះ បរាជ័យ មិនបានកត់ត្រាទុកទេ។ ដូច្នេះហើយ បានជាពេលយើងវាយ git push វាមិនមានទិន្នន័យថ្មីសម្រាប់ផ្ញើឡើយ។
</h2>
    
</body>
</html>
